services:
  postgres:
    image: postgres:16
    container_name: aegis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aegis-net

  # ── Temporal ──────────────────────────────────────────────────────
  # Temporal needs its own Postgres instance (separate DB from Aegis)
  temporal-postgres:
    image: postgres:16
    container_name: temporal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: temporal
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    ports:
      - "5433:5432"
    volumes:
      - temporal_postgres_data:/var/lib/postgresql/data
    networks:
      - aegis-net

  temporal:
    image: temporalio/auto-setup:1.27
    container_name: aegis-temporal
    restart: unless-stopped
    depends_on:
      - temporal-postgres
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgres
    ports:
      - "7233:7233"    # Temporal gRPC API (workers connect here)
    networks:
      - aegis-net

  temporal-ui:
    image: temporalio/ui:2.33.0
    container_name: aegis-temporal-ui
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8088:8080"    # Temporal Web UI
    networks:
      - aegis-net

  jaeger:
    image: jaegertracing/all-in-one:1.62
    container_name: aegis-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"    # Jaeger UI
      - "4317:4317"      # OTLP gRPC receiver
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - aegis-net

  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: aegis-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - aegis-net

  grafana:
    image: grafana/grafana:11.1.0
    container_name: aegis-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: aegis
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - aegis-net

networks:
  aegis-net:
    driver: bridge

volumes:
  postgres_data:
  temporal_postgres_data: